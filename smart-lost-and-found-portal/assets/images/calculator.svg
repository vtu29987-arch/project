<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#F1F5F9" rx="24"/>
  <circle cx="320" cy="220" r="70" fill="#E2E8F0" opacity="0.6"/>
  
  <g transform="translate(135, 20)">
    <!-- Calculator Body -->
    <rect x="0" y="0" width="130" height="255" rx="16" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
    
    <!-- Top Branding -->
    <text x="65" y="24" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#F8FAFC">CASIO</text>
    <text x="65" y="34" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#94A3B8">fx-991EX CLASSWIZ</text>
    
    <!-- Solar Cell & LCD Display -->
    <rect x="15" y="42" width="100" height="42" rx="4" fill="#E2E8F0" stroke="#0F172A" stroke-width="2"/>
    <rect x="75" y="45" width="35" height="10" rx="2" fill="#451A03" opacity="0.7"/>
    <text x="25" y="74" font-family="monospace" font-size="12" font-weight="bold" fill="#0F172A">sin(30°)=0.5</text>
    
    <!-- Function Buttons Row -->
    <circle cx="30" cy="102" r="7" fill="#64748B"/>
    <circle cx="53" cy="102" r="7" fill="#64748B"/>
    <circle cx="77" cy="102" r="7" fill="#64748B"/>
    <circle cx="100" cy="102" r="7" fill="#64748B"/>
    
    <!-- Scientific keypad grid -->
    <g fill="#334155" stroke="#1E293B">
      <rect x="15" y="118" width="18" height="14" rx="3"/>
      <rect x="39" y="118" width="18" height="14" rx="3"/>
      <rect x="63" y="118" width="18" height="14" rx="3"/>
      <rect x="87" y="118" width="18" height="14" rx="3"/>
      
      <rect x="15" y="138" width="18" height="14" rx="3"/>
      <rect x="39" y="138" width="18" height="14" rx="3"/>
      <rect x="63" y="138" width="18" height="14" rx="3"/>
      <rect x="87" y="138" width="18" height="14" rx="3"/>
      
      <!-- Number Pad -->
      <rect x="15" y="160" width="22" height="18" rx="4" fill="#F8FAFC"/>
      <rect x="42" y="160" width="22" height="18" rx="4" fill="#F8FAFC"/>
      <rect x="69" y="160" width="22" height="18" rx="4" fill="#F8FAFC"/>
      <rect x="96" y="160" width="19" height="18" rx="4" fill="#EF4444"/>
      
      <rect x="15" y="184" width="22" height="18" rx="4" fill="#F8FAFC"/>
      <rect x="42" y="184" width="22" height="18" rx="4" fill="#F8FAFC"/>
      <rect x="69" y="184" width="22" height="18" rx="4" fill="#F8FAFC"/>
      <rect x="96" y="184" width="19" height="18" rx="4" fill="#64748B"/>
      
      <rect x="15" y="208" width="22" height="18" rx="4" fill="#F8FAFC"/>
      <rect x="42" y="208" width="22" height="18" rx="4" fill="#F8FAFC"/>
      <rect x="69" y="208" width="22" height="18" rx="4" fill="#F8FAFC"/>
      <rect x="96" y="208" width="19" height="18" rx="4" fill="#0284C7"/>
    </g>
  </g>
</svg>
