<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFBEB" rx="24"/>
  <circle cx="200" cy="150" r="90" fill="#FEF3C7" opacity="0.6"/>
  
  <g transform="translate(70, 90)">
    <!-- Bridge Bar -->
    <path d="M 115 40 Q 130 32 145 40" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Left Rim & Dark Lens -->
    <g transform="translate(15, 20)">
      <path d="M 10 10 Q 55 10 95 18 Q 85 85 45 85 Q 10 80 10 10 Z" fill="#0F172A" stroke="#B45309" stroke-width="5"/>
      <path d="M 20 22 Q 45 22 75 27 Q 68 70 42 70 Q 20 68 20 22 Z" fill="#1E293B" opacity="0.9"/>
      <!-- Lens reflection gloss -->
      <line x1="30" y1="28" x2="65" y2="60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    </g>

    <!-- Right Rim & Dark Lens -->
    <g transform="translate(150, 20)">
      <path d="M 0 18 Q 40 10 85 10 Q 85 80 50 85 Q 10 85 0 18 Z" fill="#0F172A" stroke="#B45309" stroke-width="5"/>
      <path d="M 10 27 Q 40 22 65 22 Q 65 68 43 70 Q 17 70 10 27 Z" fill="#1E293B" opacity="0.9"/>
      <!-- Lens reflection gloss -->
      <line x1="25" y1="28" x2="60" y2="60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    </g>

    <!-- Temples / Arms -->
    <line x1="20" y1="35" x2="0" y2="15" stroke="#92400E" stroke-width="5" stroke-linecap="round"/>
    <line x1="240" y1="35" x2="260" y2="15" stroke="#92400E" stroke-width="5" stroke-linecap="round"/>

    <text x="130" y="130" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#92400E">RAY-BAN CLUBMASTER</text>
  </g>
</svg>
