<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#FEFCE8" rx="24"/>
  <circle cx="100" cy="90" r="70" fill="#FEF08A" opacity="0.4"/>
  
  <g transform="translate(100, 60)">
    <!-- Leather Wallet Outer -->
    <rect x="0" y="0" width="200" height="150" rx="18" fill="url(#leatherGrad)" stroke="#451A03" stroke-width="3"/>
    <!-- Stitching lines -->
    <rect x="6" y="6" width="188" height="138" rx="14" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Inner Card Pocket flap -->
    <rect x="15" y="45" width="170" height="90" rx="10" fill="#78350F" stroke="#451A03" stroke-width="2"/>
    <line x1="20" y1="52" x2="180" y2="52" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Credit Card poking out -->
    <rect x="35" y="15" width="130" height="50" rx="8" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
    <rect x="45" y="30" width="20" height="15" rx="3" fill="#FBBF24"/>
    <text x="75" y="42" font-family="monospace" font-size="8" font-weight="bold" fill="#FFFFFF">•••• 8841</text>
    
    <!-- Embossed Brand Name -->
    <text x="150" y="125" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#451A03" opacity="0.6">FOSSIL</text>
  </g>
</svg>
