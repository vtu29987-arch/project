<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#F0F9FF" rx="24"/>
  <circle cx="100" cy="180" r="70" fill="#E0F2FE" opacity="0.6"/>
  
  <g transform="translate(80, 50)">
    <!-- ID Card Lanyard Hole -->
    <rect x="100" y="5" width="40" height="8" rx="4" fill="#64748B"/>
    
    <!-- ID Card Body -->
    <rect x="0" y="15" width="240" height="155" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
    
    <!-- Header Banner -->
    <rect x="0" y="15" width="240" height="35" rx="12" fill="#0F172A"/>
    <text x="120" y="38" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">STATE UNIVERSITY IDENTITY CARD</text>
    
    <!-- Student Photo Box -->
    <rect x="15" y="60" width="65" height="75" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="47" cy="88" r="16" fill="#64748B"/>
    <path d="M 28 130 C 28 110, 66 110, 66 130 Z" fill="#64748B"/>
    
    <!-- Student Details -->
    <text x="92" y="76" font-family="sans-serif" font-weight="900" font-size="13" fill="#0F172A">JOHN DOE</text>
    <text x="92" y="92" font-family="sans-serif" font-size="9" fill="#0284C7" font-weight="bold">B.Tech - Computer Science</text>
    <text x="92" y="106" font-family="monospace" font-size="9" fill="#64748B">ID: CS-2024-8841</text>
    <text x="92" y="120" font-family="sans-serif" font-size="8" fill="#94A3B8">VALID THRU: 2028</text>
    
    <!-- Barcode at bottom -->
    <rect x="92" y="130" width="130" height="14" fill="#0F172A"/>
  </g>
</svg>
