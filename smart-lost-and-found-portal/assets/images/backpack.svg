<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#F0F9FF" rx="24"/>
  <circle cx="90" cy="230" r="60" fill="#BAE6FD" opacity="0.4"/>
  
  <g transform="translate(125, 30)">
    <!-- Top Handle -->
    <path d="M 60 40 C 60 15, 90 15, 90 40" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Main Backpack Body -->
    <path d="M 30 50 C 30 30, 120 30, 120 50 L 135 210 C 135 230, 15 230, 15 210 Z" fill="url(#packGrad)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Front Pocket -->
    <rect x="25" y="115" width="100" height="85" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <line x1="35" y1="135" x2="115" y2="135" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="115" cy="135" r="4" fill="#EF4444"/>
    
    <!-- Brand Tag / Samsonite style badge -->
    <rect x="58" y="155" width="34" height="12" rx="3" fill="#0284C7"/>
    <text x="75" y="164" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="7" fill="#FFFFFF">CAMPUS</text>
    
    <!-- Side Water Bottle Mesh Pocket -->
    <rect x="12" y="110" width="10" height="50" rx="4" fill="#334155" opacity="0.8"/>
  </g>
</svg>
